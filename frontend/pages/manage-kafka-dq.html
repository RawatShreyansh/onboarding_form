<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Kafka DQ Rules</title>
    <link rel="stylesheet" href="../styles/style.css"> 
</head>
<body>

    <div class="form-container" style="max-width: 800px; margin: 40px auto; padding: 30px;">
        <a href="source-select.html" class="back-link">← Back to Source Selection</a>
        
        <h2 style="color: #fd7e14;">Manage Kafka DQ Rules</h2>
        <p class="subtitle">Search for an existing Kafka topic to add or update its Data Quality checks.</p>
        
        <div class="search-box">
            <input type="text" id="searchTopicName" placeholder="Enter Kafka Topic Name (e.g., live.transactions.events)" />
            <button type="button" id="searchBtn" class="btn-primary" style="background: #fd7e14; border-color: #fd7e14;">Search Database</button>
        </div>
        <div id="statusMessage" class="status-msg"></div>

        <div id="dqEditorSection" style="display: none; margin-top: 30px; border-top: 2px solid #e9ecef; padding-top: 20px;">
            <h3 style="color: #333; margin-bottom: 20px;">Update Rules for: <span id="displayTableName" style="color: #fd7e14;"></span></h3>
            
            <div id="dynamicColumnsContainer">
                </div>
            
            <button type="button" id="updateBtn" class="btn-success" style="width: 100%; margin-top: 20px; display: block;">💾 Save Updated DQ Rules</button>
        </div>
    </div>

    <script src="../scripts/manage-kafka-dq.js"></script>
</body>
</html>
