<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Kafka DQ Rules</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <div class="form-container max-w-800">
        <a href="manage-dq-select.html" class="back-link">← Back to Source Selection</a>

        <h2 class="text-orange">Manage Kafka DQ Rules</h2>
        <p class="subtitle">Search for an existing Kafka topic to add or update its Data Quality checks.</p>

        <div class="ux-card">
            <h3 class="ux-card-title">Search Topic</h3>
            <div class="search-box" style="margin-bottom: 0;">
                <input type="text" id="searchTopicName"
                    placeholder="Enter Kafka Topic Name (e.g., live.transactions.events)" />
                <button type="button" id="searchBtn" class="btn-primary btn-kafka">Search Database</button>
            </div>
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <div id="dqEditorSection" class="editor-section ux-card mt-20" style="display: none;">
            <h3 class="text-dark mb-20">Update Rules for: <span id="displayTableName" class="text-orange"></span></h3>

            <div id="dynamicColumnsContainer">
            </div>

            <button type="button" id="updateBtn" class="btn-success w-100 mt-20 d-block">💾 Save Updated DQ
                Rules</button>
        </div>
    </div>

    <script src="../scripts/manage-kafka-dq.js"></script>
</body>

</html>
